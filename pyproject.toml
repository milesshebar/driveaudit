[project]
name = "driveaudit"
version = "1.0.0"
description = "Catalog drives as they are plugged in, find duplicates across them, and reconcile each against a declared source of truth. Read-only: nothing is ever deleted."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Miles Shebar" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Filesystems",
]

[project.scripts]
driveaudit = "driveaudit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driveaudit"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]
